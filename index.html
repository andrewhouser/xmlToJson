<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xmlToJson Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>xmlToJson Converter</h1>

  <div class="wrapper">
    <h4>Library-free TypeScript utility to convert XML to JSON. <a href="https://github.com/andrewhouser/xmlToJson">View on GitHub</a></h4>
    <h3>XML to transform</h3>
    <textarea id="xmltext" name="xmltext"></textarea>
    <p><button onclick="transform()">Transform</button></p>
    <h3>Transformed JSON</h3>
    <div id="jsontext" class="jsontext"></div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
